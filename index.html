<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="login-sub">Enter your ID and password to access your account.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-id">ID</label>
          <input type="text" id="login-id" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <p class="error-msg" id="login-error"></p>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <div class="divider">or</div>

      <a href="home.html" id="visitor-link" class="visitor-link">Continue as visitor</a>

      <p class="hint">
        Demo credentials: <strong>demo</strong> / <strong>demo123</strong>.
        Visitors can view the home page but not the members-only pages.
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
